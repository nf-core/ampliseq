name: nf-core AWS test
# This workflow can be triggered manually with the GitHub actions workflow dispatch button.
# It runs the -profile 'test' on AWS batch

on:
  workflow_dispatch:
jobs:
  run-platform:
    name: Run AWS tests
    if: github.repository == 'nf-core/ampliseq'
    runs-on: ubuntu-latest
    steps:
      # Launch workflow using Seqera Platform CLI tool action
      - name: Launch workflow via Seqera Platform
        id: launch
        uses: seqeralabs/action-seqera-launch@f7b1a39afc8bb65f58b84150cd214b33fe416fef # v1.0.0
        with:
          wait: running
          syntax-parser: v2
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: "aws_ireland_s3_cpu_spot"
          revision: ${{ github.sha }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}/work/ampliseq/work-${{ github.sha }}
          parameters: |
            {
              "outdir": "s3://${{ vars.AWS_S3_BUCKET }}/ampliseq/results-test-${{ github.sha }}"
            }
          profiles: test,aws_scratch
      - name: Link to the Seqera Platform run
        env:
          WORKFLOW_URL: ${{ steps.launch.outputs.workflow-url }}
        run: |
          echo "Seqera Platform run: $WORKFLOW_URL" >> "$GITHUB_STEP_SUMMARY"
