lint:
  files_exist:
    - conf/igenomes.config
    - .github/workflows/linting_comment.yml
  files_unchanged:
    - .gitattributes
    - .gitignore
    - assets/nf-core-ampliseq_logo_light.png
    - assets/nf-core-ampliseq_logo_dark.png
    - docs/images/nf-core-ampliseq_logo_light.png
    - docs/images/nf-core-ampliseq_logo_dark.png
  nextflow_config: false
  nf_test_content:
    - tests/comparison_incompatible.nf.test
    - tests/savont_incompatible.nf.test
    - tests/savont_multiregion.nf.test
    - tests/savont_nosamples.nf.test
    - tests/dada_ref_duplicates.nf.test
  schema_params: false
nf_core_version: 4.2.1
repository_type: pipeline
template:
  author: Daniel Straub, Alexander Peltzer
  description: Amplicon sequencing analysis workflow using DADA2 and QIIME2
  force: false
  is_nfcore: true
  name: ampliseq
  org: nf-core
  outdir: .
  skip_features:
    - igenomes
  version: 3.1.0
