name: consolidate_taxonomy
description: Picks a per-ASV winning classifier and database across several taxonomy tables
keywords:
  - taxonomy
  - consolidation
  - classifier
  - database
tools:
  - dada2:
      description: Infers exact amplicon sequence variants (ASVs) from high-throughput amplicon sequencing data
      homepage: https://bioconductor.org/packages/dada2
      documentation: https://benjjneb.github.io/dada2/
      licence:
        - LGPL-2
      identifier: biotools:dada2
input:
  - tax_files:
      type: file
      description: Taxonomy tables (TSV) in the DADA2-like wide format, one per classifier and database
  - method:
      type: string
      description: "Consolidation method: first, most-specific or score"
  - sources:
      type: string
      description: Comma-separated CLASSIFIER:database entries, one per file, in the order of the files and in priority order
  - taxlevels_input:
      type: string
      description: Comma-separated taxonomic rank names, empty to use the database's own
  - outfile:
      type: string
      description: Name of the output table
output:
  tsv:
    - outfile:
        type: file
        description: Consolidated taxonomy table (TSV)
        pattern: outfile
  versions_consolidate_taxonomy:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
