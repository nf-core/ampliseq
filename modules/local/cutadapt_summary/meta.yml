name: cutadapt_summary
description: Summarises Cutadapt logs into a table
keywords:
  - cutadapt
  - primer
  - summary
tools:
  - python:
      description: The Python programming language
      homepage: https://www.python.org/
      licence:
        - PSF-2.0
      identifier: ""
input:
  - name:
      type: string
      description: Output file name prefix
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'test' ]
    - logs:
        type: file
        description: Cutadapt log files
output:
  tsv:
    - "*_summary.tsv":
        type: file
        description: Cutadapt summary table (TSV)
        pattern: "*_summary.tsv"
  versions_cutadapt_summary:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
