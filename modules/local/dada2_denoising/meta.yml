name: dada2_denoising
description: Infers ASVs with DADA2 and merges read pairs
keywords:
  - dada2
  - denoising
  - asv
  - amplicon
tools:
  - dada2:
      description: Infers exact amplicon sequence variants (ASVs) from high-throughput amplicon sequencing data
      homepage: https://bioconductor.org/packages/dada2
      documentation: https://benjjneb.github.io/dada2/
      licence:
        - LGPL-2
      identifier: biotools:dada2
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'test' ]
    - filtered/*:
        type: file
        description: Filtered reads (FASTQ)
    - errormodel:
        type: file
        description: DADA2 error models (RDS)
output:
  denoised:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'test' ]
      - "*.dada.rds":
          type: file
          description: DADA2 denoising results (RDS)
          pattern: "*.dada.rds"
  seqtab:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'test' ]
      - "*.seqtab.rds":
          type: file
          description: DADA2 sequence table (RDS)
          pattern: "*.seqtab.rds"
  mergers:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'test' ]
      - "*.mergers.rds":
          type: file
          description: Merged read pairs (RDS)
          pattern: "*.mergers.rds"
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'test' ]
      - "*.log":
          type: file
          description: Log file
          pattern: "*.log"
  versions_dada2_denoising:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
  args:
    - "*.args.txt":
        type: file
        description: Arguments passed to the tool, for the summary report
        pattern: "*.args.txt"
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
