name: format_taxonomy_qiime
description: Formats a reference database for QIIME2
keywords:
  - qiime2
  - taxonomy
  - database
  - format
tools:
  - bash:
      description: The GNU Bourne-Again SHell
      homepage: https://www.gnu.org/software/bash/
      licence:
        - GPL-3.0-or-later
      identifier: ""
input:
  - database:
      type: file
      description: Reference database files
output:
  tax:
    - "*.tax":
        type: file
        description: Reference taxonomy (TSV)
        pattern: "*.tax"
  fasta:
    - "*.fna":
        type: file
        description: Reference sequences (FASTA)
        pattern: "*.fna"
  ref_tax_info:
    - ref_taxonomy.txt:
        type: file
        description: Reference database provenance
        pattern: ref_taxonomy.txt
  versions_format_taxonomy_qiime:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
