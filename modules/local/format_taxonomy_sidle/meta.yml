name: format_taxonomy_sidle
description: Formats a reference database for Sidle
keywords:
  - sidle
  - taxonomy
  - database
  - format
tools:
  - bash:
      description: The GNU Bourne-Again SHell
      homepage: https://www.gnu.org/software/bash/
      licence:
        - GPL-3.0-or-later
      identifier: ""
input:
  - database.tar.gz:
      type: file
      description: Reference database archive
  - suffix:
      type: string
      description: Suffix of the provenance file name
output:
  seq:
    - "*.seq.fasta":
        type: file
        description: Reference sequences (FASTA)
        pattern: "*.seq.fasta"
  alnseq:
    - "*.alnseq.fasta":
        type: file
        description: Aligned reference sequences (FASTA)
        pattern: "*.alnseq.fasta"
  tax:
    - "*.tax.txt":
        type: file
        description: Reference taxonomy (TSV)
        pattern: "*.tax.txt"
  ref_tax_info:
    - ref_taxonomy.*.txt:
        type: file
        description: Reference database provenance
        pattern: ref_taxonomy.*.txt
  versions_format_taxonomy_sidle:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
