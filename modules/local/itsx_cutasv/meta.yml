name: itsx_cutasv
description: Extracts ITS regions from ASV sequences with ITSx
keywords:
  - itsx
  - its
  - asv
  - extraction
tools:
  - itsx:
      description: Extracts the ITS1 and ITS2 subregions from ITS sequences
      homepage: https://microbiology.se/software/itsx/
      licence:
        - GPL-3.0
      identifier: biotools:itsx
input:
  - fasta:
      type: file
      description: ASV sequences in FASTA format
  - outfile:
      type: string
      description: Output file name
output:
  fasta:
    - outfile:
        type: file
        description: Extracted ITS sequences (FASTA)
        pattern: outfile
  summary:
    - ASV_ITS_seqs.summary.txt:
        type: file
        description: ITSx summary
        pattern: ASV_ITS_seqs.summary.txt
  fastas:
    - ASV_ITS_seqs.*fasta:
        type: file
        description: Sequences of the individual ITS subregions (FASTA)
        pattern: ASV_ITS_seqs.*fasta
  versions_itsx_cutasv:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
  args:
    - "*.args.txt":
        type: file
        description: Arguments passed to the tool, for the summary report
        pattern: "*.args.txt"
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
