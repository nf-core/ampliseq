name: metadata_pairwise
description: Lists metadata columns suitable for pairwise statistical tests
keywords:
  - metadata
  - statistics
  - qiime2
tools:
  - dada2:
      description: Infers exact amplicon sequence variants (ASVs) from high-throughput amplicon sequencing data
      homepage: https://bioconductor.org/packages/dada2
      documentation: https://benjjneb.github.io/dada2/
      licence:
        - LGPL-2
      identifier: biotools:dada2
input:
  - metadata:
      type: file
      description: Sample metadata table (TSV)
output:
  category:
    - stdout:
        type: string
        description: Comma-separated metadata column names
  versions_metadata_pairwise:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
