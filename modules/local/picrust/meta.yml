name: picrust
description: Predicts functional abundances with PICRUSt2
keywords:
  - picrust2
  - functional prediction
  - pathways
tools:
  - picrust2:
      description: "PICRUSt2: Phylogenetic Investigation of Communities by Reconstruction of Unobserved States"
      homepage: https://github.com/picrust/picrust2
      licence:
        - GPL-3.0
      identifier: biotools:picrust2
input:
  - seq:
      type: file
      description: ASV sequences in FASTA format
  - abund:
      type: file
      description: Abundance table (TSV or BIOM)
  - source:
      type: string
      description: Source of the input, QIIME2 or DADA2
  - message:
      type: string
      description: Name of the message file
output:
  outfolder:
    - all_output/*:
        type: file
        description: All PICRUSt2 output
        pattern: all_output/*
  pathways:
    - "*_descrip.tsv":
        type: file
        description: Predicted abundances with descriptions (TSV)
        pattern: "*_descrip.tsv"
  versions_picrust:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
  args:
    - "*.args.txt":
        type: file
        description: Arguments passed to the tool, for the summary report
        pattern: "*.args.txt"
  message:
    - ${message}.txt:
        type: file
        description: Message for the summary report
        pattern: ${message}.txt
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
