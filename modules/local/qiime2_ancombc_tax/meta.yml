name: qiime2_ancombc_tax
description: Differential abundance testing of taxa at one rank with QIIME2 ANCOM-BC
keywords:
  - qiime2
  - ancombc
  - differential abundance
  - taxonomy
tools:
  - qiime2:
      description: Microbiome multi-omics data science platform
      homepage: https://qiime2.org
      licence:
        - BSD-3-Clause
      identifier: biotools:qiime2
input:
  - - metadata:
        type: file
        description: Sample metadata table (TSV)
    - table:
        type: file
        description: QIIME2 feature table artifact
    - taxonomy:
        type: file
        description: QIIME2 taxonomy artifact
    - taxlevel:
        type: integer
        description: Taxonomic level to collapse to
    - formula_in:
        type: string
        description: ANCOM-BC formula
output:
  da_barplot:
    - da_barplot/*:
        type: file
        description: Exported differential abundance barplots
        pattern: da_barplot/*
  differentials:
    - differentials/*:
        type: file
        description: Exported differentials
        pattern: differentials/*
  qza:
    - "*.qza":
        type: file
        description: QIIME2 artifact
        pattern: "*.qza"
  qzv:
    - "*.qzv":
        type: file
        description: QIIME2 visualisation
        pattern: "*.qzv"
  versions_qiime2_ancombc_tax:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
