name: qiime2_inseq
description: Imports ASV sequences into QIIME2
keywords:
  - qiime2
  - import
  - sequences
tools:
  - qiime2:
      description: Microbiome multi-omics data science platform
      homepage: https://qiime2.org
      licence:
        - BSD-3-Clause
      identifier: biotools:qiime2
input:
  - seq:
      type: file
      description: ASV sequences in FASTA format
output:
  qza:
    - rep-seqs.qza:
        type: file
        description: QIIME2 representative sequences artifact
        pattern: rep-seqs.qza
  versions_qiime2_inseq:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
