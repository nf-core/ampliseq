name: qiime2_intree
description: Imports a phylogenetic tree into QIIME2
keywords:
  - qiime2
  - import
  - phylogeny
tools:
  - qiime2:
      description: Microbiome multi-omics data science platform
      homepage: https://qiime2.org
      licence:
        - BSD-3-Clause
      identifier: biotools:qiime2
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'test' ]
    - tree:
        type: file
        description: Phylogenetic tree (Newick)
output:
  qza:
    - tree.qza:
        type: file
        description: QIIME2 rooted tree artifact
        pattern: tree.qza
  versions_qiime2_intree:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
