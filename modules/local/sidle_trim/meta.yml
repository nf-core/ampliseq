name: sidle_trim
description: Trims regional ASVs to a common length for Sidle
keywords:
  - sidle
  - multi-region
  - trim
tools:
  - q2-sidle:
      description: QIIME 2 implementation of SMURF, reconstructing full-length marker genes from multiple amplified regions
      homepage: https://github.com/jwdebelius/q2-sidle
      licence:
        - BSD-3-Clause
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'test' ]
    - table:
        type: file
        description: QIIME2 feature table artifact
    - seq:
        type: file
        description: QIIME2 representative sequences artifact
output:
  table:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'test' ]
      - "*_table.qza":
          type: file
          description: QIIME2 feature table artifact
          pattern: "*_table.qza"
  seq:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. [ id:'test' ]
      - "*_rep-seqs.qza":
          type: file
          description: QIIME2 representative sequences artifact
          pattern: "*_rep-seqs.qza"
  versions_sidle_trim:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@d4straub"
maintainers:
  - "@d4straub"
  - "@erikrikarddaniel"
